[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "multi-tower-moe"
version = "0.1.0"
description = "Multi-Tower Mixture-of-Experts transformer trained on Shakespeare"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
